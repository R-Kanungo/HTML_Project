<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rohan Kanungo - Developer Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- FEATURE 1: Scroll Progress Bar -->
    <div id="scroll-progress"></div>

    <nav class="navbar">
        <div class="nav-brand">RK.</div>
        <ul class="nav-links">
            <li><a href="#about">About</a></li>
            <li><a href="#education">Education</a></li>
            <!-- FEATURE 2: Theme Toggle Button -->
            <li><button id="theme-toggle" class="theme-btn">☀️ Light Mode</button></li>
        </ul>
    </nav>

    <header class="hero">
        <h1 class="gradient-text">Rohan Kanungo</h1>
        <p class="subtitle">I work with <span id="typewriter" class="accent-text"></span><span class="cursor">|</span></p>
    </header>

    <main>
        <!-- (Your existing About, Skills, and Education sections stay exactly the same here) -->

        <!-- FEATURE 3: Live GitHub Fetcher Section -->
        <section id="github-projects" class="card">
            <h2>Live GitHub Repositories</h2>
            <p>Pulling directly from GitHub via API:</p>
            <div id="repo-container" class="repo-grid">
                <!-- JavaScript will inject your repos here -->
                <p>Loading repositories...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Rohan Kanungo</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
